<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B0A" />
      <stop offset="50%" stop-color="#1A120B" />
      <stop offset="100%" stop-color="#0E0A06" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sceau / Fond Circulaire Héraldique -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Tronc et Racines Entrelacées (Arbre Généalogique) -->
  <g filter="url(#shadow)">
    <!-- Racines -->
    <path d="M256 360 C240 400 200 440 140 450 M256 370 C256 410 240 445 220 460 M256 370 C260 410 275 445 300 460 M256 360 C270 400 310 440 370 450" 
          fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Tronc principal -->
    <path d="M256 380 C246 320 248 270 230 220 M256 380 C266 320 264 270 282 220" 
          fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M256 370 L256 210" 
          fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Branches Principales -->
    <!-- Branche Gauche (Paternelle) -->
    <path d="M246 250 C210 230 170 230 130 180 M185 220 C160 170 140 130 160 90 M130 180 C110 160 90 140 90 100" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />

    <!-- Branche Droite (Maternelle) -->
    <path d="M266 250 C302 230 342 230 382 180 M327 220 C352 170 372 130 352 90 M382 180 C402 160 422 140 422 100" 
          fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />

    <!-- Branche Centrale -->
    <path d="M256 210 C245 160 250 120 256 70" 
          fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Nœuds de Générations (Fleurs / Feuilles / Blasons Sosa) -->
    <!-- Racine Génération 1 (De Cujus) -->
    <circle cx="256" cy="370" r="14" fill="#FDE047" stroke="#78350F" stroke-width="3" />
    <circle cx="256" cy="370" r="6" fill="#78350F" />

    <!-- Nœuds Génération 2 (Parents) -->
    <circle cx="205" cy="235" r="12" fill="#FDE047" stroke="#78350F" stroke-width="3" />
    <circle cx="307" cy="235" r="12" fill="#FDE047" stroke="#78350F" stroke-width="3" />

    <!-- Nœuds Génération 3 (Grands-Parents) -->
    <circle cx="130" cy="180" r="10" fill="url(#goldGrad)" stroke="#451A03" stroke-width="2" />
    <circle cx="185" cy="160" r="10" fill="url(#goldGrad)" stroke="#451A03" stroke-width="2" />
    <circle cx="327" cy="160" r="10" fill="url(#goldGrad)" stroke="#451A03" stroke-width="2" />
    <circle cx="382" cy="180" r="10" fill="url(#goldGrad)" stroke="#451A03" stroke-width="2" />

    <!-- Nœuds Génération 4 (Aïeux cime) -->
    <circle cx="90" cy="100" r="9" fill="url(#emeraldGrad)" stroke="#064E3B" stroke-width="2" />
    <circle cx="160" cy="90" r="9" fill="url(#emeraldGrad)" stroke="#064E3B" stroke-width="2" />
    <circle cx="256" cy="70" r="11" fill="#FDE047" stroke="#78350F" stroke-width="3" />
    <circle cx="352" cy="90" r="9" fill="url(#emeraldGrad)" stroke="#064E3B" stroke-width="2" />
    <circle cx="422" cy="100" r="9" fill="url(#emeraldGrad)" stroke="#064E3B" stroke-width="2" />
  </g>
</svg>
